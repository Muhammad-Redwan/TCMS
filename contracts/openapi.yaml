# DRAFT — written by the frontend so Sprint 0–4 screens can be built against mocks.
# The backend owns the canonical spec in tcms-backend/api/ (D7). Replace this file with the
# published backend spec as soon as it exists; do not treat anything here as backend behavior.
#
# Conventions proposed for backend review (guide §4 "Cross-cutting request rules"):
# - Pagination follows Spring Data's PagedModel JSON: ?page (0-based) &size &sort=field,asc|desc,
#   response { content: [...], page: { size, number, totalElements, totalPages } }.
# - Single-resource GET returns an ETag; updates send If-Match and answer 412 when stale.
# - Creates accept an Idempotency-Key header; a replay returns the original result.
# - Money is a decimal string plus currency, never a JSON number; totals are server-calculated.
# - Dates without time (tripDate, effectiveFrom) are calendar days: YYYY-MM-DD, no time zone.
# - Errors are RFC 9457 ProblemDetail with code, traceId, fieldErrors (D8).
openapi: 3.1.0
info:
  title: TCMS API
  version: 0.3.0-draft
servers:
  - url: /api
tags:
  - name: session
  - name: organization
  - name: departments
  - name: employees
  - name: tenants
  - name: jobs
  - name: users
  - name: policies
  - name: claims
paths:
  /v1/me:
    get:
      operationId: getMe
      summary: Current user, active tenant and effective permissions
      tags: [session]
      responses:
        '200':
          description: Signed-in user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Problem' }

  /v1/organization:
    get:
      operationId: getOrganization
      tags: [organization]
      responses:
        '200':
          description: Company profile of the active tenant
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateOrganization
      tags: [organization]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationUpdate' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/organization/setup:
    get:
      operationId: getSetupStatus
      summary: Onboarding checklist computed by the backend (T03)
      tags: [organization]
      responses:
        '200':
          description: Setup progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/departments:
    get:
      operationId: listDepartments
      summary: All departments of the tenant (small list, not paged)
      tags: [departments]
      responses:
        '200':
          description: Departments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Department' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createDepartment
      tags: [departments]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/departments/{departmentId}:
    parameters:
      - { name: departmentId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateDepartment
      tags: [departments]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/employees:
    get:
      operationId: listEmployees
      tags: [employees]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - { name: q, in: query, description: 'Matches name, employee number or email', schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/EmployeeStatus' } }
        - { name: departmentId, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of employees
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeePage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createEmployee
      tags: [employees]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeCreate' }
      responses:
        '201':
          description: Created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/employees/{employeeId}:
    parameters:
      - { name: employeeId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getEmployee
      tags: [employees]
      responses:
        '200':
          description: Employee
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateEmployee
      tags: [employees]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeUpdate' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/platform/tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TenantStatus' } }
      responses:
        '200':
          description: One page of tenants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createTenant
      summary: Starts asynchronous provisioning; the tenant is usable only once status is READY
      tags: [tenants]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantCreate' }
      responses:
        '202':
          description: Provisioning started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/platform/tenants/{tenantId}:
    parameters:
      - { name: tenantId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getTenant
      tags: [tenants]
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/platform/tenants/{tenantId}/provisioning/retry:
    parameters:
      - { name: tenantId, in: path, required: true, schema: { type: string } }
    post:
      operationId: retryTenantProvisioning
      tags: [tenants]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Provisioning restarted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/jobs/{jobId}:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getJob
      summary: Status of an asynchronous job (D12); poll with bounded backoff
      tags: [jobs]
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/users:
    get:
      operationId: listUsers
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' } }
      responses:
        '200':
          description: One page of users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getUser
      tags: [users]
      responses:
        '200':
          description: User
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/users/{userId}/roles:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    put:
      operationId: setUserRoles
      summary: Replaces the user's role assignment; backend applies it in Keycloak
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserRolesUpdate' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/roles:
    get:
      operationId: listRoles
      summary: Predefined roles available to the tenant (custom roles are post-MVP, I02)
      tags: [users]
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/policies:
    get:
      operationId: listPolicies
      summary: All policy versions of the tenant, newest first (small list, not paged)
      tags: [policies]
      responses:
        '200':
          description: Policies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PolicySummary' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createPolicy
      summary: Creates a DRAFT policy
      tags: [policies]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyWrite' }
      responses:
        '201':
          description: Created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/policies/current:
    get:
      operationId: getCurrentPolicy
      summary: Policy in force today for the signed-in employee (claim screens)
      tags: [policies]
      responses:
        '200':
          description: Current policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '404':
          description: No published policy is in force yet
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/policies/{policyId}:
    parameters:
      - { name: policyId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getPolicy
      tags: [policies]
      responses:
        '200':
          description: Policy
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: updatePolicy
      summary: Replaces a DRAFT policy; published versions are immutable (409)
      tags: [policies]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyWrite' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/policies/{policyId}/publish:
    parameters:
      - { name: policyId, in: path, required: true, schema: { type: string } }
    post:
      operationId: publishPolicy
      summary: Publishes a DRAFT; it applies to claims whose trips fall on or after effectiveFrom
      tags: [policies]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Published
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/policies/{policyId}/new-version:
    parameters:
      - { name: policyId, in: path, required: true, schema: { type: string } }
    post:
      operationId: createPolicyVersion
      summary: Copies a published policy into a new DRAFT version
      tags: [policies]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Draft created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/claims:
    get:
      operationId: listMyClaims
      summary: Claims owned by the signed-in employee
      tags: [claims]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ClaimStatus' } }
        - { name: period, in: query, description: 'YYYY-MM', schema: { type: string } }
      responses:
        '200':
          description: One page of claims
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimSummaryPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createClaim
      summary: Creates a DRAFT claim owned by the signed-in employee
      tags: [claims]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimWrite' }
      responses:
        '201':
          description: Created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/claims/upload-policy:
    get:
      operationId: getReceiptUploadPolicy
      summary: Receipt limits the UI checks before uploading (the backend re-checks)
      tags: [claims]
      responses:
        '200':
          description: Limits
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptUploadPolicy' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/claims/{claimId}:
    parameters:
      - { name: claimId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getClaim
      tags: [claims]
      responses:
        '200':
          description: Claim with server-calculated total, findings and allowed actions
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateClaim
      summary: Replaces period and items; allowed only when allowedActions contains EDIT
      tags: [claims]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimWrite' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteClaim
      summary: Discards a DRAFT; allowed only when allowedActions contains DELETE
      tags: [claims]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

  /v1/claims/{claimId}/submit:
    parameters:
      - { name: claimId, in: path, required: true, schema: { type: string } }
    post:
      operationId: submitClaim
      summary: Final recalculation and transition to SUBMITTED; 422 CLAIM_HAS_BLOCKING_FINDINGS otherwise
      tags: [claims]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Submitted
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/claims/{claimId}/receipts/upload-url:
    parameters:
      - { name: claimId, in: path, required: true, schema: { type: string } }
    post:
      operationId: createReceiptUpload
      summary: Reserves a receipt and returns a short-lived presigned upload URL (D11)
      tags: [claims]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiptUploadRequest' }
      responses:
        '201':
          description: Upload slot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptUploadSlot' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/claims/{claimId}/receipts/{receiptId}:
    parameters:
      - { name: claimId, in: path, required: true, schema: { type: string } }
      - { name: receiptId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getReceipt
      tags: [claims]
      responses:
        '200':
          description: Receipt with scan status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteReceipt
      summary: Removes a receipt from an editable claim
      tags: [claims]
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }

  /v1/claims/{claimId}/receipts/{receiptId}/complete:
    parameters:
      - { name: claimId, in: path, required: true, schema: { type: string } }
      - { name: receiptId, in: path, required: true, schema: { type: string } }
    post:
      operationId: completeReceiptUpload
      summary: Confirms the upload finished; the backend then scans the file
      tags: [claims]
      responses:
        '200':
          description: Receipt (usually SCANNING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/claims/{claimId}/receipts/{receiptId}/download-url:
    parameters:
      - { name: claimId, in: path, required: true, schema: { type: string } }
      - { name: receiptId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getReceiptDownloadUrl
      summary: Short-lived presigned URL, issued only for CLEAN receipts the caller may see
      tags: [claims]
      responses:
        '200':
          description: Download URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadUrl' }
        default: { $ref: '#/components/responses/Problem' }

components:
  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page index
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      description: 'field,asc or field,desc'
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the last read; stale values get 412
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable per user intent; reused on retry of the same intent
      schema: { type: string }

  headers:
    ETag:
      description: Opaque version of the resource for optimistic concurrency
      schema: { type: string }

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Me:
      type: object
      required: [userId, displayName, tenant, memberships, permissions]
      properties:
        userId: { type: string }
        displayName: { type: string }
        email: { type: string, format: email }
        locale: { type: string, enum: [ar, en] }
        tenant: { $ref: '#/components/schemas/TenantContext' }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/TenantMembership' }
        permissions:
          type: array
          items: { type: string }
    TenantContext:
      type: object
      required: [id, displayName, timezone, currency]
      properties:
        id: { type: string }
        displayName: { type: string }
        timezone: { type: string, description: IANA timezone }
        currency: { type: string, description: ISO 4217 code }
    TenantMembership:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string }
        displayName: { type: string }

    PageMetadata:
      type: object
      required: [size, number, totalElements, totalPages]
      properties:
        size: { type: integer }
        number: { type: integer, description: Zero-based page index }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    Organization:
      type: object
      required: [legalName, displayName, timezone, currency, defaultLocale, version]
      properties:
        legalName: { type: string }
        displayName: { type: string }
        timezone: { type: string }
        currency: { type: string }
        defaultLocale: { type: string, enum: [ar, en] }
        version: { type: integer, format: int64 }
    OrganizationUpdate:
      type: object
      required: [legalName, displayName, timezone, currency, defaultLocale]
      properties:
        legalName: { type: string }
        displayName: { type: string }
        timezone: { type: string }
        currency: { type: string }
        defaultLocale: { type: string, enum: [ar, en] }

    SetupStatus:
      type: object
      required: [ready, steps]
      properties:
        ready: { type: boolean }
        steps:
          type: array
          items: { $ref: '#/components/schemas/SetupStep' }
    SetupStep:
      type: object
      required: [key, status]
      properties:
        key: { type: string, enum: [ORGANIZATION, ACCESS, EMPLOYEE_SOURCE, POLICY] }
        status: { type: string, enum: [DONE, PENDING, NOT_AVAILABLE] }

    Department:
      type: object
      required: [id, name, employeeCount, version]
      properties:
        id: { type: string }
        name: { type: string }
        managerId: { type: [string, 'null'] }
        managerName: { type: [string, 'null'] }
        employeeCount: { type: integer }
        version: { type: integer, format: int64 }
    DepartmentWrite:
      type: object
      required: [name]
      properties:
        name: { type: string }
        managerId: { type: [string, 'null'] }

    EmployeeStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    Employee:
      type: object
      required: [id, employeeNumber, fullName, status, version]
      properties:
        id: { type: string }
        employeeNumber: { type: string, description: 'HR identifier, unique within the tenant' }
        fullName: { type: string }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        departmentId: { type: [string, 'null'] }
        departmentName: { type: [string, 'null'] }
        managerId: { type: [string, 'null'] }
        managerName: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/EmployeeStatus' }
        userId: { type: [string, 'null'], description: 'Linked sign-in account; differs from the HR id' }
        version: { type: integer, format: int64 }
    EmployeeCreate:
      type: object
      required: [employeeNumber, fullName]
      properties:
        employeeNumber: { type: string }
        fullName: { type: string }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        departmentId: { type: [string, 'null'] }
        managerId: { type: [string, 'null'] }
    EmployeeUpdate:
      allOf:
        - $ref: '#/components/schemas/EmployeeCreate'
        - type: object
          required: [status]
          properties:
            status: { $ref: '#/components/schemas/EmployeeStatus' }
    EmployeePage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Employee' }
        page: { $ref: '#/components/schemas/PageMetadata' }

    TenantStatus:
      type: string
      enum: [PROVISIONING, READY, FAILED]
    Tenant:
      type: object
      required: [id, displayName, legalName, adminEmail, status, createdAt]
      properties:
        id: { type: string }
        displayName: { type: string }
        legalName: { type: string }
        adminEmail: { type: string, format: email }
        timezone: { type: string }
        currency: { type: string }
        status: { $ref: '#/components/schemas/TenantStatus' }
        provisioningJobId: { type: [string, 'null'] }
        failureReference: { type: [string, 'null'], description: 'Support reference when status is FAILED' }
        createdAt: { type: string, format: date-time }
    TenantCreate:
      type: object
      required: [displayName, legalName, adminEmail, timezone, currency, defaultLocale]
      properties:
        displayName: { type: string }
        legalName: { type: string }
        adminEmail: { type: string, format: email }
        timezone: { type: string }
        currency: { type: string }
        defaultLocale: { type: string, enum: [ar, en] }
    TenantPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Tenant' }
        page: { $ref: '#/components/schemas/PageMetadata' }

    Job:
      type: object
      required: [id, type, status, updatedAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [TENANT_PROVISIONING, EMPLOYEE_IMPORT, SETTLEMENT_EXPORT] }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED] }
        processed: { type: [integer, 'null'] }
        total: { type: [integer, 'null'] }
        errorCode: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }

    UserStatus:
      type: string
      enum: [ACTIVE, INVITED, DISABLED]
    User:
      type: object
      required: [id, displayName, email, status, roles, version]
      properties:
        id: { type: string }
        displayName: { type: string }
        email: { type: string, format: email }
        status: { $ref: '#/components/schemas/UserStatus' }
        employeeId: { type: [string, 'null'] }
        roles:
          type: array
          items: { type: string, description: Role key }
        version: { type: integer, format: int64 }
    UserPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/User' }
        page: { $ref: '#/components/schemas/PageMetadata' }
    Role:
      type: object
      required: [key, permissions]
      properties:
        key: { type: string, description: 'Stable key, e.g. EMPLOYEE, APPROVER; UI label comes from translations' }
        permissions:
          type: array
          items: { type: string }
    UserRolesUpdate:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items: { type: string }

    Money:
      type: string
      description: 'Decimal amount as a string, never a JSON number (e.g. "12.500" for KWD)'
      pattern: '^-?\d+(\.\d+)?$'

    TransportMode:
      type: string
      enum: [TAXI, RIDE_HAILING, BUS, METRO, PERSONAL_CAR, OTHER]

    PolicyStatus:
      type: string
      enum: [DRAFT, PUBLISHED, RETIRED]
    PolicySummary:
      type: object
      required: [id, name, status, version, effectiveFrom]
      properties:
        id: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/PolicyStatus' }
        version: { type: integer, format: int64, description: 'Policy version number shown to users' }
        effectiveFrom: { type: string, format: date }
    PolicyWrite:
      type: object
      required: [name, effectiveFrom, currency, monthlyLimit, perTripLimit, receiptRequiredAbove, allowedModes, submissionDeadlineDays]
      properties:
        name: { type: string }
        effectiveFrom: { type: string, format: date, description: 'Applies to trips on or after this calendar day' }
        currency: { type: string }
        monthlyLimit: { $ref: '#/components/schemas/Money' }
        perTripLimit: { $ref: '#/components/schemas/Money' }
        receiptRequiredAbove: { $ref: '#/components/schemas/Money' }
        allowedModes:
          type: array
          items: { $ref: '#/components/schemas/TransportMode' }
        eligibleDepartmentIds:
          type: array
          description: Empty means every department
          items: { type: string }
        submissionDeadlineDays: { type: integer, description: 'Days after the claim month ends' }
    Policy:
      allOf:
        - $ref: '#/components/schemas/PolicyWrite'
        - type: object
          required: [id, status, version, rev]
          properties:
            id: { type: string }
            status: { $ref: '#/components/schemas/PolicyStatus' }
            version: { type: integer, format: int64, description: 'Policy version number shown to users' }
            rev: { type: integer, format: int64, description: 'Concurrency revision behind the ETag' }
            publishedAt: { type: [string, 'null'], format: date-time }

    ClaimStatus:
      type: string
      enum: [DRAFT, SUBMITTED, NEEDS_CHANGES, UNDER_REVIEW, APPROVED, REJECTED, READY_FOR_SETTLEMENT, SETTLED]
    ClaimAction:
      type: string
      enum: [EDIT, SUBMIT, DELETE]
    ClaimItemWrite:
      type: object
      required: [tripDate, mode, fromLocation, toLocation, amount]
      properties:
        tripDate: { type: string, format: date, description: 'Calendar day of the trip; no time zone' }
        mode: { $ref: '#/components/schemas/TransportMode' }
        fromLocation: { type: string }
        toLocation: { type: string }
        purpose: { type: [string, 'null'] }
        amount: { $ref: '#/components/schemas/Money' }
        receiptId: { type: [string, 'null'] }
    ClaimItem:
      allOf:
        - $ref: '#/components/schemas/ClaimItemWrite'
        - type: object
          required: [id]
          properties:
            id: { type: string }
    ClaimWrite:
      type: object
      required: [period, items]
      properties:
        period: { type: string, description: 'Claim month, YYYY-MM' }
        items:
          type: array
          items: { $ref: '#/components/schemas/ClaimItemWrite' }
    PolicyFinding:
      type: object
      required: [code, severity]
      properties:
        code: { type: string, description: 'Stable code; UI text comes from translations' }
        severity: { type: string, enum: [INFO, WARNING, BLOCKING] }
        itemIndex: { type: [integer, 'null'], description: 'Line the finding refers to, if any' }
        params:
          type: object
          additionalProperties: { type: string }
    TimelineEvent:
      type: object
      required: [at, type]
      properties:
        at: { type: string, format: date-time }
        type: { type: string, enum: [CREATED, SUBMITTED, CHANGES_REQUESTED, RESUBMITTED, APPROVED, REJECTED, EXPORTED, SETTLED] }
        actorName: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
    Claim:
      type: object
      required: [id, number, status, period, currency, totalAmount, items, receipts, findings, allowedActions, timeline, updatedAt, version]
      properties:
        id: { type: string }
        number: { type: string, description: 'Human reference, e.g. CLM-2026-0042' }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        period: { type: string }
        currency: { type: string }
        totalAmount: { $ref: '#/components/schemas/Money' }
        policyId: { type: [string, 'null'] }
        policyVersion: { type: [integer, 'null'] }
        items:
          type: array
          items: { $ref: '#/components/schemas/ClaimItem' }
        receipts:
          type: array
          items: { $ref: '#/components/schemas/Receipt' }
        findings:
          type: array
          items: { $ref: '#/components/schemas/PolicyFinding' }
        allowedActions:
          type: array
          items: { $ref: '#/components/schemas/ClaimAction' }
        timeline:
          type: array
          items: { $ref: '#/components/schemas/TimelineEvent' }
        submittedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    ClaimSummary:
      type: object
      required: [id, number, status, period, currency, totalAmount, itemCount, updatedAt]
      properties:
        id: { type: string }
        number: { type: string }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        period: { type: string }
        currency: { type: string }
        totalAmount: { $ref: '#/components/schemas/Money' }
        itemCount: { type: integer }
        submittedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
    ClaimSummaryPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ClaimSummary' }
        page: { $ref: '#/components/schemas/PageMetadata' }

    ScanStatus:
      type: string
      enum: [AWAITING_UPLOAD, SCANNING, CLEAN, REJECTED]
    Receipt:
      type: object
      required: [id, fileName, contentType, sizeBytes, scanStatus, uploadedAt]
      properties:
        id: { type: string }
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        scanStatus: { $ref: '#/components/schemas/ScanStatus' }
        rejectionCode: { type: [string, 'null'], description: 'e.g. MALWARE_DETECTED, CONTENT_TYPE_MISMATCH' }
        duplicateOfClaimNumber: { type: [string, 'null'], description: 'Same file already on another claim; for review, never auto-removed' }
        uploadedAt: { type: string, format: date-time }
    ReceiptUploadPolicy:
      type: object
      required: [maxFileSizeBytes, allowedContentTypes, maxReceiptsPerClaim]
      properties:
        maxFileSizeBytes: { type: integer, format: int64 }
        allowedContentTypes:
          type: array
          items: { type: string }
        maxReceiptsPerClaim: { type: integer }
    ReceiptUploadRequest:
      type: object
      required: [fileName, contentType, sizeBytes]
      properties:
        fileName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, format: int64 }
    ReceiptUploadSlot:
      type: object
      required: [receiptId, uploadUrl, method, headers, expiresAt]
      properties:
        receiptId: { type: string }
        uploadUrl: { type: string, description: 'Presigned object-storage URL' }
        method: { type: string, enum: [PUT] }
        headers:
          type: object
          description: Headers the upload must send exactly (e.g. Content-Type)
          additionalProperties: { type: string }
        expiresAt: { type: string, format: date-time }
    DownloadUrl:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string }
        expiresAt: { type: string, format: date-time }

    Problem:
      type: object
      description: RFC 9457 ProblemDetail with TCMS extensions (D8)
      required: [status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: Stable machine-readable error code }
        traceId: { type: string }
        fieldErrors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string, description: 'Path, e.g. receipts[1].amount' }
        code: { type: string }
        message: { type: string }
