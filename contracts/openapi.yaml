# DRAFT — written by the frontend so Sprint 0/1 screens can be built against mocks.
# The backend owns the canonical spec in tcms-backend/api/ (D7). Replace this file with the
# published backend spec as soon as it exists; do not treat anything here as backend behavior.
#
# Conventions proposed for backend review (guide §4 "Cross-cutting request rules"):
# - Pagination follows Spring Data's PagedModel JSON: ?page (0-based) &size &sort=field,asc|desc,
#   response { content: [...], page: { size, number, totalElements, totalPages } }.
# - Single-resource GET returns an ETag; updates send If-Match and answer 412 when stale.
# - Creates accept an Idempotency-Key header; a replay returns the original result.
# - Errors are RFC 9457 ProblemDetail with code, traceId, fieldErrors (D8).
openapi: 3.1.0
info:
  title: TCMS API
  version: 0.2.0-draft
servers:
  - url: /api
tags:
  - name: session
  - name: organization
  - name: departments
  - name: employees
  - name: tenants
  - name: jobs
  - name: users
paths:
  /v1/me:
    get:
      operationId: getMe
      summary: Current user, active tenant and effective permissions
      tags: [session]
      responses:
        '200':
          description: Signed-in user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Problem' }

  /v1/organization:
    get:
      operationId: getOrganization
      tags: [organization]
      responses:
        '200':
          description: Company profile of the active tenant
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateOrganization
      tags: [organization]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationUpdate' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/organization/setup:
    get:
      operationId: getSetupStatus
      summary: Onboarding checklist computed by the backend (T03)
      tags: [organization]
      responses:
        '200':
          description: Setup progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/departments:
    get:
      operationId: listDepartments
      summary: All departments of the tenant (small list, not paged)
      tags: [departments]
      responses:
        '200':
          description: Departments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Department' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createDepartment
      tags: [departments]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/departments/{departmentId}:
    parameters:
      - { name: departmentId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateDepartment
      tags: [departments]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/employees:
    get:
      operationId: listEmployees
      tags: [employees]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - { name: q, in: query, description: 'Matches name, employee number or email', schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/EmployeeStatus' } }
        - { name: departmentId, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of employees
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeePage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createEmployee
      tags: [employees]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeCreate' }
      responses:
        '201':
          description: Created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/employees/{employeeId}:
    parameters:
      - { name: employeeId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getEmployee
      tags: [employees]
      responses:
        '200':
          description: Employee
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateEmployee
      tags: [employees]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeUpdate' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/platform/tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TenantStatus' } }
      responses:
        '200':
          description: One page of tenants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createTenant
      summary: Starts asynchronous provisioning; the tenant is usable only once status is READY
      tags: [tenants]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantCreate' }
      responses:
        '202':
          description: Provisioning started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/platform/tenants/{tenantId}:
    parameters:
      - { name: tenantId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getTenant
      tags: [tenants]
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/platform/tenants/{tenantId}/provisioning/retry:
    parameters:
      - { name: tenantId, in: path, required: true, schema: { type: string } }
    post:
      operationId: retryTenantProvisioning
      tags: [tenants]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Provisioning restarted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/jobs/{jobId}:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getJob
      summary: Status of an asynchronous job (D12); poll with bounded backoff
      tags: [jobs]
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/users:
    get:
      operationId: listUsers
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' } }
      responses:
        '200':
          description: One page of users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getUser
      tags: [users]
      responses:
        '200':
          description: User
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/users/{userId}/roles:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    put:
      operationId: setUserRoles
      summary: Replaces the user's role assignment; backend applies it in Keycloak
      tags: [users]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserRolesUpdate' }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Problem' }

  /v1/roles:
    get:
      operationId: listRoles
      summary: Predefined roles available to the tenant (custom roles are post-MVP, I02)
      tags: [users]
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
        default: { $ref: '#/components/responses/Problem' }

components:
  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page index
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      description: 'field,asc or field,desc'
      schema: { type: string }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the last read; stale values get 412
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable per user intent; reused on retry of the same intent
      schema: { type: string }

  headers:
    ETag:
      description: Opaque version of the resource for optimistic concurrency
      schema: { type: string }

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Me:
      type: object
      required: [userId, displayName, tenant, memberships, permissions]
      properties:
        userId: { type: string }
        displayName: { type: string }
        email: { type: string, format: email }
        locale: { type: string, enum: [ar, en] }
        tenant: { $ref: '#/components/schemas/TenantContext' }
        memberships:
          type: array
          items: { $ref: '#/components/schemas/TenantMembership' }
        permissions:
          type: array
          items: { type: string }
    TenantContext:
      type: object
      required: [id, displayName, timezone, currency]
      properties:
        id: { type: string }
        displayName: { type: string }
        timezone: { type: string, description: IANA timezone }
        currency: { type: string, description: ISO 4217 code }
    TenantMembership:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string }
        displayName: { type: string }

    PageMetadata:
      type: object
      required: [size, number, totalElements, totalPages]
      properties:
        size: { type: integer }
        number: { type: integer, description: Zero-based page index }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    Organization:
      type: object
      required: [legalName, displayName, timezone, currency, defaultLocale, version]
      properties:
        legalName: { type: string }
        displayName: { type: string }
        timezone: { type: string }
        currency: { type: string }
        defaultLocale: { type: string, enum: [ar, en] }
        version: { type: integer, format: int64 }
    OrganizationUpdate:
      type: object
      required: [legalName, displayName, timezone, currency, defaultLocale]
      properties:
        legalName: { type: string }
        displayName: { type: string }
        timezone: { type: string }
        currency: { type: string }
        defaultLocale: { type: string, enum: [ar, en] }

    SetupStatus:
      type: object
      required: [ready, steps]
      properties:
        ready: { type: boolean }
        steps:
          type: array
          items: { $ref: '#/components/schemas/SetupStep' }
    SetupStep:
      type: object
      required: [key, status]
      properties:
        key: { type: string, enum: [ORGANIZATION, ACCESS, EMPLOYEE_SOURCE, POLICY] }
        status: { type: string, enum: [DONE, PENDING, NOT_AVAILABLE] }

    Department:
      type: object
      required: [id, name, employeeCount, version]
      properties:
        id: { type: string }
        name: { type: string }
        managerId: { type: [string, 'null'] }
        managerName: { type: [string, 'null'] }
        employeeCount: { type: integer }
        version: { type: integer, format: int64 }
    DepartmentWrite:
      type: object
      required: [name]
      properties:
        name: { type: string }
        managerId: { type: [string, 'null'] }

    EmployeeStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    Employee:
      type: object
      required: [id, employeeNumber, fullName, status, version]
      properties:
        id: { type: string }
        employeeNumber: { type: string, description: 'HR identifier, unique within the tenant' }
        fullName: { type: string }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        departmentId: { type: [string, 'null'] }
        departmentName: { type: [string, 'null'] }
        managerId: { type: [string, 'null'] }
        managerName: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/EmployeeStatus' }
        userId: { type: [string, 'null'], description: 'Linked sign-in account; differs from the HR id' }
        version: { type: integer, format: int64 }
    EmployeeCreate:
      type: object
      required: [employeeNumber, fullName]
      properties:
        employeeNumber: { type: string }
        fullName: { type: string }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        departmentId: { type: [string, 'null'] }
        managerId: { type: [string, 'null'] }
    EmployeeUpdate:
      allOf:
        - $ref: '#/components/schemas/EmployeeCreate'
        - type: object
          required: [status]
          properties:
            status: { $ref: '#/components/schemas/EmployeeStatus' }
    EmployeePage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Employee' }
        page: { $ref: '#/components/schemas/PageMetadata' }

    TenantStatus:
      type: string
      enum: [PROVISIONING, READY, FAILED]
    Tenant:
      type: object
      required: [id, displayName, legalName, adminEmail, status, createdAt]
      properties:
        id: { type: string }
        displayName: { type: string }
        legalName: { type: string }
        adminEmail: { type: string, format: email }
        timezone: { type: string }
        currency: { type: string }
        status: { $ref: '#/components/schemas/TenantStatus' }
        provisioningJobId: { type: [string, 'null'] }
        failureReference: { type: [string, 'null'], description: 'Support reference when status is FAILED' }
        createdAt: { type: string, format: date-time }
    TenantCreate:
      type: object
      required: [displayName, legalName, adminEmail, timezone, currency, defaultLocale]
      properties:
        displayName: { type: string }
        legalName: { type: string }
        adminEmail: { type: string, format: email }
        timezone: { type: string }
        currency: { type: string }
        defaultLocale: { type: string, enum: [ar, en] }
    TenantPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Tenant' }
        page: { $ref: '#/components/schemas/PageMetadata' }

    Job:
      type: object
      required: [id, type, status, updatedAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [TENANT_PROVISIONING, EMPLOYEE_IMPORT, SETTLEMENT_EXPORT] }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED] }
        processed: { type: [integer, 'null'] }
        total: { type: [integer, 'null'] }
        errorCode: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }

    UserStatus:
      type: string
      enum: [ACTIVE, INVITED, DISABLED]
    User:
      type: object
      required: [id, displayName, email, status, roles, version]
      properties:
        id: { type: string }
        displayName: { type: string }
        email: { type: string, format: email }
        status: { $ref: '#/components/schemas/UserStatus' }
        employeeId: { type: [string, 'null'] }
        roles:
          type: array
          items: { type: string, description: Role key }
        version: { type: integer, format: int64 }
    UserPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/User' }
        page: { $ref: '#/components/schemas/PageMetadata' }
    Role:
      type: object
      required: [key, permissions]
      properties:
        key: { type: string, description: 'Stable key, e.g. EMPLOYEE, APPROVER; UI label comes from translations' }
        permissions:
          type: array
          items: { type: string }
    UserRolesUpdate:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items: { type: string }

    Problem:
      type: object
      description: RFC 9457 ProblemDetail with TCMS extensions (D8)
      required: [status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: Stable machine-readable error code }
        traceId: { type: string }
        fieldErrors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string, description: 'Path, e.g. receipts[1].amount' }
        code: { type: string }
        message: { type: string }
