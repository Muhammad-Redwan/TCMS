# Publishes the mock-mode demo (no backend; fabricated data kept in each visitor's browser)
# to GitHub Pages at https://<owner>.github.io/<repo>/.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build mock-mode demo for the repository sub-path
        run: npm run build:demo -- --base-href "/${{ github.event.repository.name }}/"
      # Pages has no SPA rewrites: serve the app for deep links via 404.html.
      - run: cp dist/tcms-frontend/browser/index.html dist/tcms-frontend/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/tcms-frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
