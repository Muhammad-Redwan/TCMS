# Serves the Angular build inside the container. The gateway in front routes /api/** and the
# OIDC/logout endpoints to the backend (D16), so this server only ever sees SPA and static requests.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Hashed bundles never change: cache for a year.
  location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Runtime config changes per environment: never cache.
  location = /config.json {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store";
  }

  # Translations change per deploy: always revalidate.
  location /i18n/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  # Client-side routes fall back to index.html, which must never be cached.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
