# Security headers (frontend guide §9). Included in every location because nginx drops
# server-level add_header directives in any location that sets its own headers.
# connect-src (uploads, file downloads) and img-src (receipt previews) must also list the object-storage origin
# that issues presigned URLs (D11), e.g. https://receipts.<domain>.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
